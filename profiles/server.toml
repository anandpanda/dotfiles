# Headless Linux boxes reached over SSH (Coder workspaces, servers): the terminal and git
# stack plus the Claude harness. No apps, fonts, terminal emulator, containers or desktop defaults.
# A work box: `dots install server-work` (adds the overlay).
identities = ["personal"]
modules = ["workspace", "secrets", "git", "ssh", "cli", "shell", "zsh", "starship", "atuin", "tmux", "gh", "mise", "claude"]
