# Global mise config. Projects pin their own in mise.toml, .nvmrc, .python-version, go.mod.
# Per-project env and secrets: mise.toml [env] / .env / mise.local.toml (see README).
[tools]
node = "lts"
python = "latest"
go = "latest"
uv = "latest"
pnpm = "latest"

[settings]
# Honour the files work repos already use.
idiomatic_version_file_enable_tools = ["node", "python", "go"]
# A pinned version that is not installed gets installed the first time its command runs.
not_found_auto_install = true
experimental = false

[settings.python]
# In a project with uv.lock, create .venv if missing and activate it on cd.
uv_venv_auto = "create|source"

[settings.upgrade]
# `mise up` must not delete the old runtime: auto-created venvs point at the exact version.
auto_prune = false
