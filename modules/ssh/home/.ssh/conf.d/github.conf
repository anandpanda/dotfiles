# Static. Each alias lists its candidate keys in order; ssh skips files that do not exist.
# The generated key comes first; a Coder workspace has only its account key.
Host github.com-personal
  HostName github.com
  User git
  IdentityFile ~/.ssh/id_ed25519_personal
  IdentityFile ~/.ssh/git-commit-signing/coder
  IdentitiesOnly yes

Host github.com-work
  HostName github.com
  User git
  IdentityFile ~/.ssh/id_ed25519_work
  IdentityFile ~/.ssh/git-commit-signing/coder
  IdentitiesOnly yes

Host *
  AddKeysToAgent yes
  ServerAliveInterval 60
