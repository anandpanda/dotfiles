# lazygit. Catppuccin Mocha (vendored from catppuccin/lazygit mocha/blue), delta as pager,
# VS Code as editor. Keys worth knowing are in README.md.
gui:
  theme:
    activeBorderColor:
      - '#89b4fa'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    searchingActiveBorderColor:
      - '#f9e2af'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    inactiveViewSelectedLineBgColor:
      - '#6c7086'
    cherryPickedCommitFgColor:
      - '#89b4fa'
    cherryPickedCommitBgColor:
      - '#45475a'
    markedBaseCommitFgColor:
      - '#89b4fa'
    markedBaseCommitBgColor:
      - '#f9e2af'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
    authorColors:
      '*': '#b4befe'
  nerdFontsVersion: "3"
  showIcons: true
  showFileTree: true
  sidePanelWidth: 0.3333
  mouseEvents: true
git:
  paging:
    colorArg: always
    pager: delta --dark --paging=never --line-numbers --hyperlinks --side-by-side=false
  autoFetch: true
  autoRefresh: true
  overrideGpg: true
os:
  editPreset: vscode
update:
  method: never
notARepository: skip
disableStartupPopups: true
