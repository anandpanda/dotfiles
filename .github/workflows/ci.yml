name: ci
on: [push, pull_request]
jobs:
  lint-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck bats shfmt
      - run: shellcheck install.sh doctor.sh bootstrap.sh lib/*.sh scripts/*.sh modules/*/install.sh
      - run: shfmt -i 2 -ci -d install.sh doctor.sh bootstrap.sh lib scripts modules
      - run: bats tests
  install:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: ./install.sh personal
      - shell: bash -euo pipefail {0}
        run: ./install.sh personal | tee second.log && ! grep -E '^(link|backup|mkdir|prepend|set) ' second.log
      - run: ./doctor.sh
