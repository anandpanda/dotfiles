name: ci
on: [push, pull_request]
jobs:
  lint-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck bats shfmt
      - run: shellcheck install.sh doctor.sh bootstrap.sh lib/*.sh scripts/*.sh $(find modules -name '*.sh')
      - run: shfmt -i 2 -ci -d install.sh doctor.sh bootstrap.sh lib scripts $(find modules -name '*.sh')
      - run: sudo apt-get install -y -qq zsh && for f in $(find modules -name '*.zsh' -o -name '.zsh*' -type f); do zsh -n "$f"; done
      - run: bats tests
  install:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: ./install.sh personal
      # No terminal in CI, so run the two commands the zsh preflight prints.
      - run: |
          z="$(dirname "$(dirname "$(command -v brew || echo /home/linuxbrew/.linuxbrew/bin/brew)")")/bin/zsh"
          [ -x "$z" ] || z="$(ls /opt/homebrew/bin/zsh /home/linuxbrew/.linuxbrew/bin/zsh 2>/dev/null | head -1)"
          grep -qxF "$z" /etc/shells || echo "$z" | sudo tee -a /etc/shells
          sudo chsh -s "$z" "$USER"
      - shell: bash -euo pipefail {0}
        run: ./install.sh personal | tee second.log && ! grep -E '^(link|backup|mkdir|prepend|set) ' second.log
      - run: ./doctor.sh
      # The unit tests must also pass on macOS (Apple's bash 3.2, BSD tools).
      - if: runner.os == 'macOS'
        run: brew install -q bats-core && bats tests
